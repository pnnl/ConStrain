name: Docker Workflow Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-docker-workflow:
    name: Test Docker Workflow Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker workflow image
        run: |
          docker build -f docker/Dockerfile.workflow -t constrain:test .
      
      - name: Test default workflow execution
        run: |
          echo "Running default G36 demo workflow..."
          docker run --rm constrain:test > docker_output.log 2>&1
          
          # Check if workflow completed successfully
          if grep -q "Workflow completed successfully!" docker_output.log; then
            echo "✅ Docker workflow test PASSED - Workflow completed successfully"
            cat docker_output.log
            exit 0
          else
            echo "❌ Docker workflow test FAILED - 'Workflow completed successfully!' not found in output"
            echo "Docker output:"
            cat docker_output.log
            exit 1
          fi
      
      - name: Upload Docker output log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docker-workflow-output
          path: docker_output.log
          retention-days: 7
