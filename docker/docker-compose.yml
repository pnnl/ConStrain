services:
  # Backend API Server - Unified REST API for verification, reporting, and workflow execution
  # Replaces separate workflow, verification, and reporting services
  api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-server
    image: constrain-api-server:latest
    container_name: constrain-api-server
    ports:
      - "8000:8000"
    volumes:
      # Mount directories for data access and results storage
      - ./examples/data:/data/data:ro
      - ./examples/verification_cases:/data/verification_cases:ro
      - ./examples/schema:/data/schema:ro
      - ./examples_results:/data/results
      - ../weather:/app/weather:ro
      - ../resources:/app/resources:ro
      - ../constrain/tolerances.json:/app/tolerances.json:ro
    environment:
      - PYTHONPATH=/app
      - OUTPUT_DIR=/data/results
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - constrain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web UI Service - FastAPI-based frontend with Jinja2 templates
  # Replaces Streamlit service and removes docker socket dependency
  api-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-ui
    image: constrain-api-ui:latest
    container_name: constrain-api-ui
    ports:
      - "8080:8000"
    volumes:
      # Mount template directory for live updates during development
      - ../constrain/app/templates:/app/constrain/app/templates
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONSTRAIN_API_BASE_URL=${CONSTRAIN_API_BASE_URL:-http://api-server:8000}
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - constrain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  constrain-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
